include: package:lints/recommended.yaml

analyzer:
  # The desktop app is its own package with its own rules, and analysing it
  # from here would pull Flutter into a plain Dart analysis.
  exclude:
    - app/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - unawaited_futures
