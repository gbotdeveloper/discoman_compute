name: Release

# Bump `version:` in pubspec.yaml and push to main — that is the whole release
# flow. This reads the new version, builds the desktop app on macOS and
# Windows, and publishes a GitHub Release carrying the installers. A push that
# leaves the version line alone does nothing.
#
# Running it by hand from the Actions tab builds both platforms but publishes
# nothing, so the pipeline can be exercised without cutting a release.
#
# The macOS build is signed with GBot's Developer ID and notarised by Apple,
# so it opens without a warning. The Windows build is still unsigned and
# raises SmartScreen: the cheap signing route is closed to Turkish companies,
# and a certificate earns its SmartScreen reputation through download volume
# anyway, so it waits until there is traffic to earn that with.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      full_version: ${{ steps.version.outputs.full_version }}
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the checks below need the history and the tags

      - name: Extract version from pubspec.yaml
        id: version
        run: |
          # The build number stays out of the tag and the release name. It
          # exists for CFBundleVersion and the Windows file version, not for
          # people, and releasing on it would put two entries called v0.1.0
          # next to each other. A re-release means bumping the version proper.
          version_line=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          echo "full_version=$version_line" >> $GITHUB_OUTPUT
          echo "version_name=$(echo "$version_line" | cut -d'+' -f1)" >> $GITHUB_OUTPUT
          echo "build_number=$(echo "$version_line" | cut -d'+' -f2)" >> $GITHUB_OUTPUT

      - name: Check if the version line changed in this commit
        id: version_diff
        run: |
          # A manual run is a test build, not a release, so whether this
          # commit touched the version line does not apply to it.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger, version diff check bypassed"
            echo "version_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          current=$(git show HEAD:pubspec.yaml | grep '^version:')
          previous=$(git show HEAD~1:pubspec.yaml 2>/dev/null | grep '^version:' || echo "")

          if [ "$current" = "$previous" ]; then
            echo "Version line unchanged in this commit ('$current'), skipping build"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          else
            echo "Version line changed: '$previous' -> '$current'"
            echo "version_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if the version was already released
        id: decide
        run: |
          if [ "${{ steps.version_diff.outputs.version_changed }}" != "true" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          release_tag="v${{ steps.version.outputs.version_name }}"

          if [ -n "$(git tag -l "$release_tag")" ]; then
            echo "$release_tag already exists, skipping build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "$release_tag is new, proceeding with builds"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build-macos:
    needs: version-check
    if: needs.version-check.outputs.should_build == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Build the app
        run: |
          flutter build macos --release \
            --build-name=${{ needs.version-check.outputs.version_name }} \
            --build-number=${{ needs.version-check.outputs.build_number }}

      - name: Unlock the signing certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"

          # Without this codesign stops to ask for permission to use the key,
          # and on a runner there is nobody to answer.
          security set-key-partition-list \
            -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null

          # codesign's own --keychain flag is not enough: unless the keychain
          # is on the search list the identity comes back as "no identity
          # found".
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '":' | xargs)

      - name: Sign the app
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          app=$(ls -d build/macos/Build/Products/Release/*.app)

          # Inside out. A bundle's signature seals a hash of everything inside
          # it, so signing a framework afterwards would invalidate the app.
          for framework in "$app"/Contents/Frameworks/*.framework; do
            codesign --force --options runtime --timestamp \
              --sign "$IDENTITY" "$framework"
          done

          codesign --force --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$IDENTITY" "$app"

          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Pack the disk image
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          app=$(ls -d build/macos/Build/Products/Release/*.app)
          staging=$(mktemp -d)
          cp -R "$app" "$staging/"
          # The Applications symlink is what makes the window a drag-and-drop
          # install rather than something the person has to copy by hand.
          ln -s /Applications "$staging/Applications"
          hdiutil create \
            -volname "Discoman Compute" \
            -srcfolder "$staging" \
            -format UDZO -ov \
            DiscomanCompute-macos.dmg

          codesign --force --timestamp --sign "$IDENTITY" DiscomanCompute-macos.dmg

      - name: Notarise the disk image
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/api_key.p8"

          # --wait blocks until Apple has scanned the upload and exits non-zero
          # if it comes back Invalid, so a rejected build fails the run here
          # rather than shipping.
          xcrun notarytool submit DiscomanCompute-macos.dmg \
            --key "$RUNNER_TEMP/api_key.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --wait

          rm "$RUNNER_TEMP/api_key.p8"

          # Writes Apple's approval into the file itself. Without it the first
          # launch asks Apple over the network, and fails on a machine offline.
          xcrun stapler staple DiscomanCompute-macos.dmg
          xcrun stapler validate DiscomanCompute-macos.dmg

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: DiscomanCompute-macos.dmg

  build-windows:
    needs: version-check
    if: needs.version-check.outputs.should_build == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Build the app
        run: >
          flutter build windows --release
          --build-name=${{ needs.version-check.outputs.version_name }}
          --build-number=${{ needs.version-check.outputs.build_number }}

      - name: Zip the build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath DiscomanCompute-windows.zip

      - name: Build the installer
        shell: pwsh
        run: |
          # Installed rather than assumed: the runner image ships some version
          # of Inno Setup, and setup.iss needs 6.3 or newer for
          # ArchitecturesAllowed=x64compatible.
          choco install innosetup --no-progress -y

          $source = "$PWD\build\windows\x64\runner\Release"
          $exe = (Get-ChildItem "$source\*.exe")[0].Name

          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ needs.version-check.outputs.version_name }}" `
            "/DAppExeName=$exe" `
            "/DSourceDir=$source" `
            "/DOutputDir=$PWD" `
            installer\setup.iss

      - name: Upload the installer and the zip
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            DiscomanCompute-Setup.exe
            DiscomanCompute-windows.zip

  release:
    needs: [version-check, build-macos, build-windows]
    # A manual run stops after the builds: its artifacts are there to download
    # from the run page, but only a version bump on main publishes a release.
    if: needs.version-check.outputs.should_build == 'true' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the release files
        run: |
          mkdir -p release
          mv artifacts/macos/DiscomanCompute-macos.dmg release/
          mv artifacts/windows/DiscomanCompute-Setup.exe release/
          mv artifacts/windows/DiscomanCompute-windows.zip release/
          ls -la release

      - name: Write the release notes
        id: notes
        run: |
          previous_tag=$(git tag -l 'v*' | sort -V | tail -1)

          if [ -z "$previous_tag" ]; then
            changelog=$(git log --pretty=format:'- %s' --no-merges --max-count=50)
            compare=""
          else
            changelog=$(git log --pretty=format:'- %s' --no-merges "${previous_tag}..HEAD")
            compare="**Full changelog**: https://github.com/${{ github.repository }}/compare/${previous_tag}...v${{ needs.version-check.outputs.version_name }}"
          fi

          {
            echo "body<<GBOT_EOF"
            echo "## Downloads"
            echo
            echo "- **macOS** — \`DiscomanCompute-macos.dmg\`"
            echo "- **Windows** — \`DiscomanCompute-Setup.exe\`"
            echo "- **Windows, no installer** — \`DiscomanCompute-windows.zip\`"
            echo
            echo "The macOS build is signed and notarised, and opens normally. The"
            echo "Windows build is not signed yet, so SmartScreen shows a warning the"
            echo "first time: choose **More info → Run anyway**."
            echo
            echo "## What's changed"
            echo
            echo "$changelog"
            echo
            echo "$compare"
            echo "GBOT_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-check.outputs.version_name }}
          name: Discoman Compute v${{ needs.version-check.outputs.version_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          # Deliberately not marked prerelease while the version is 0.x:
          # GitHub's /releases/latest/download/ links skip prereleases, and
          # those links are what the website's download buttons point at.
          prerelease: false
          files: release/*
