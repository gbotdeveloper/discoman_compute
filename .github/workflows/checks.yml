name: Checks

# The worker engine and the desktop app around it.
#
# test/vendored_client_test.dart matters more here than the count suggests: the
# vendored client is trimmed to what this worker uses, and the two things it
# guards are looked up by name at runtime, so dropping either leaves everything
# analysing clean and fails only against a real server.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install dependencies
        working-directory: packages/worker
        run: dart pub get

      - name: Analyze
        working-directory: packages/worker
        run: dart analyze

      - name: Test
        working-directory: packages/worker
        run: dart test

  app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Test
        run: flutter test

  # Downloads and installs the real Python on the two platforms the desktop app
  # ships for, since its archive layout and paths differ between them.
  python-install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install dependencies
        working-directory: packages/worker
        run: dart pub get

      - name: Install Python
        working-directory: packages/worker
        env:
          DISCOMAN_LIVE_PYTHON_INSTALL: '1'
        run: dart test test/python_installer_live_test.dart
