name: Checks

# The worker engine and the desktop app around it.
#
# test/vendored_client_test.dart matters more here than the count suggests: the
# vendored client is trimmed to what this worker uses, and the two things it
# guards are looked up by name at runtime, so dropping either leaves everything
# analysing clean and fails only against a real server.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install dependencies
        working-directory: packages/worker
        run: dart pub get

      - name: Analyze
        working-directory: packages/worker
        run: dart analyze

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Lets the example script's test run.
      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Test
        working-directory: packages/worker
        run: dart test

  # Runs are set up with junctions and hard links on Windows rather than
  # symbolic links, so the run folder and what builds on it are tested there
  # too. The rest of the suite assumes POSIX paths.
  worker-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Install dependencies
        working-directory: packages/worker
        run: dart pub get

      - name: Test
        working-directory: packages/worker
        run: >-
          dart test test/run_folder_test.dart test/runner_script_test.dart
          test/run_environment_test.dart test/execution_processor_test.dart
          test/example_script_test.dart test/script_store_test.dart
          test/packages_test.dart

  app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Test
        run: flutter test

  # Downloads and installs the real Python on the two platforms the desktop app
  # ships for, since its archive layout and paths differ between them. Also
  # measures a real run there, since memory and processor time are read
  # differently on each.
  python-install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'

      - name: Install dependencies
        working-directory: packages/worker
        run: dart pub get

      - name: Install Python
        working-directory: packages/worker
        env:
          DISCOMAN_LIVE_PYTHON_INSTALL: '1'
        run: dart test test/python_installer_live_test.dart

      - name: Measure a run
        working-directory: packages/worker
        run: dart test test/python_runner_test.dart --name measuring
